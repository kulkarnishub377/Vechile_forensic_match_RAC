# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Vehicle Forensic Matching System v3.0 - Configuration Template
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# ⚠️  IMPORTANT SECURITY NOTES:
# 
# 1. PLACEHOLDERS: This file contains template values (YOUR_*).
#    Replace all YOUR_* placeholders with YOUR actual values.
#
# 2. PASSWORDS: NEVER store passwords in plain text in this file.
#    Use environment variables instead:
#    - Windows: set DB_PASSWORD=your_password
#    - Linux:   export DB_PASSWORD=your_password
#
# 3. SENSITIVE DATA: Never commit this file to public repositories
#    with actual credentials. Keep credentials in .env or secrets.
#
# 4. LOCAL/NETWORK PATHS: Update paths to match your environment.
#    Test paths before running the system.
#
# 5. DATABASE CREDENTIALS: Verify credentials have minimum permissions:
#    - SELECT on vehicle tables
#    - SELECT on transaction tables
#    - No DELETE/UPDATE permissions (read-only preferred)
#
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Vehicle Forensic Matching System v3.0 - Configuration
# Enhanced with TorchReID + Advanced Matching
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[system]
version = 3.0.0
embedding_version = v512
environment = production
timezone = UTC

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# PATHS CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[paths]
# Directory paths
vector_db_path = vector_db
models_dir = models
data_dir = data
logs_dir = logs

# Image path mapping (for database image paths)
# Enable this to map image paths from database to network location
# TODO: Update these paths to match your environment
enable_path_mapping = false
path_mapping_source = YOUR_LOCAL_IMAGE_PATH    # Example: E:\_Images or /data/images
path_mapping_target = YOUR_NETWORK_IMAGE_PATH  # Example: \\SERVER_IP\_Images

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DATABASE CONFIGURATION (MSSQL - READ ONLY)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[database]
# SECURITY: Update these credentials to match your environment
# TODO: Configure server, database name, and username below
server = YOUR_SQL_SERVER_IP      # Example: 192.168.1.100 or db.example.com
database = YOUR_DATABASE_NAME     # Example: VehicleTrackingDB
username = YOUR_DATABASE_USER     # Example: app_user
# ⚠️  PASSWORD: Set via environment variable ONLY
#    Windows: set DB_PASSWORD=your_password
#    Linux:   export DB_PASSWORD=your_password
driver = ODBC Driver 18 for SQL Server
trust_certificate = yes
encrypt = no

# Connection pooling
pool_size = 20
max_overflow = 40
pool_timeout = 30
pool_recycle = 3600
query_timeout = 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# REID MODEL CONFIGURATION (TorchReID OSNet-AIN)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[reid]
# Backend: "torchreid" (PyTorch) or "openvino" (faster CPU - RECOMMENDED)
backend = openvino

# TorchReID Model (PyTorch backend)
checkpoint_path = models/reid/custom/osnet_ain_x1_0_custom_final.pth
model_name = osnet_ain_x1_0
image_size = 384
multi_scale = false
embedding_dim = 512

# OpenVINO Model (OpenVINO backend - FASTER, RECOMMENDED)
# OSNet-V3 OpenVINO FP16 (384x384) - Fast CPU inference (~18ms, 53 FPS)
openvino_path = models/reid/openvino/osnet_ain_x1_0_custom.xml

# Device
device = CPU
use_gpu = false
gpu_id = 0

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# YOLO DETECTOR CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[yolo]
# Backend: "pytorch" or "openvino"
backend = openvino

# PyTorch Model
pytorch_model_path = models/detection/yolov5n_sites_v3.pt

# OpenVINO Model
openvino_model_path = models/detection/yolo26n_site_v3_openvino_model/yolo26n_site_v3.xml
openvino_device = CPU
openvino_precision = FP16

# Detection parameters
confidence_threshold = 0.10
iou_threshold = 0.4
image_size = 480

# Vehicle detector thresholds
vehicle_conf_threshold = 0.15
vehicle_iou_threshold = 0.45

# Plate detector thresholds
plate_conf_threshold = 0.30
plate_iou_threshold = 0.45

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# OCR CONFIGURATION (PaddleOCR)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[ocr]
enable = true
backend = paddle

# PaddleOCR Models (complete 3-model pipeline)
# Recognition model (extracts text from plate)
rec_model_dir = models/ocr_models/PP-OCRv4_mobile_rec_infer_v16
dict_path = models/ocr_models/PP-OCRv4_mobile_rec_infer_v16/plate_dict.txt

# Detection model (finds text regions)
det_model_dir = models/ocr_models/en_PP-OCRv3_det_infer

# Classification model (corrects orientation)
cls_model_dir = models/ocr_models/ch_ppocr_mobile_v2.0_cls_slim_infer

# Legacy paths (for backward compatibility)
model_dir = models/ocr/PP-OCRv4_mobile_rec_infer_v16

# OCR Settings
use_angle_cls = true
lang = en
confidence_threshold = 0.60
use_gpu = false
enable_mkldnn = true
cpu_threads = 4

# Text validation
min_text_length = 4
max_text_length = 10
allowed_characters = 0123456789ABCDEFGHJKLMNOPQRSTUVWXYZ

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# MATCHING CONFIGURATION
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[matching]
# OCR-First Matching Strategy
enable_ocr_matching = true
ocr_exact_match_only = true
ocr_min_confidence = 0.70
ocr_boost_score = 0.30

# Multi-Feature Fusion Weights
embedding_weight = 0.70
color_weight = 0.10
time_weight = 0.10
orb_weight = 0.05
scale_weight = 0.05

# Search Parameters
time_window_hours = 10
uncombined_search_hours = 10
default_top_k = 10
max_top_k = 50
faiss_k_multiplier = 4

# Similarity Thresholds
min_similarity_score = 0.55
min_orb_matches = 8

# Confidence Assessment
score_gap_high = 0.15
score_gap_medium = 0.08

# ORB Verification
orb_lowe_ratio = 0.75
ransac_reproj_threshold = 5.0
min_ransac_inliers = 8

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# FAISS VECTOR DATABASE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[faiss]
# IVF Indexing
use_ivf = true
ivf_nlist = 100
ivf_nprobe = 12

# Lazy Loading
lazy_load = true
preload_current = true
max_loaded_partitions = 3
partition_ttl_hours = 20

# Auto-save (crash protection)
auto_save_interval = 20

# Search
search_batch_size = 200

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# INGESTION SERVICE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[ingestion]
# Batch processing (optimized for memory efficiency)
# CRITICAL: Reduced worker_threads from 6→3 to prevent OOM errors
# Each worker loads ~300MB (YOLO + ReID + tensors)
# 6 workers × 300MB = 1.8GB causing memory exhaustion
batch_size = 16
worker_threads = 3
poll_interval = 10

# First-time startup: Fetch data from 8 hours ago
lookback_hours = 8

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# API SERVICE
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[api]
host = 0.0.0.0
port = 8899
workers = 1
timeout = 120
reload = false

# Authentication (optional)
enable_api_key_auth = false
rate_limit = 100

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CACHING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[cache]
enable = true
ttl = 600
max_size = 1000

# Redis
redis_host = localhost
redis_port = 6379
redis_db = 0
redis_max_connections = 50

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# LOGGING
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
[logging]
level = INFO
format = %%(asctime)s | %%(levelname)-8s | %%(process)d:%%(threadName)s | %%(name)s | %%(message)s
date_format = %%Y-%%m-%%d %%H:%%M:%%S

# Log rotation
max_size_mb = 100
backup_count = 7


